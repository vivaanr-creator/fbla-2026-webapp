<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c36">
  <title>{{ title }} | Explore FoCo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  {% block extra_css %}{% endblock %}
  <script src="{{ url_for('static', filename='js/menu.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <nav>
  <a href="#home">Home</a>

  <div class="dropdown">
    <a href="#learn-more">Learn More ▾</a>
    <div class="dropdown-content">
      <a href="#places-to-go">Places to Go</a>
      <a href="#things-to-do">Things to Do</a>
    </div>
  </div>

  <div class="dropdown">
    <a href="#events">Events ▾</a>
    <div class="dropdown-content">
      <a href="#trending">Trending</a>
      <a href="#upcoming-events">Upcoming Events</a>
    </div>
  </div>

  <div class="dropdown">
    <a href="#stay">Stay ▾</a>
    <div class="dropdown-content">
      <a href="#plan-your-trip">Plan Your Trip</a>
      <a href="#where-to-stay">Where to Stay</a>
      <a href="#visitor-information">Visitor Information</a>
      <a href="#travel-tips">Travel Tips</a>
    </div>
  </div>
</nav>
<script>
  nav {
    display: flex;
    align-items: center;
    gap: 24px;
    background-color: #001470;
    font-family: Arial, Helvetica, sans-serif;
  }

  nav a {
    display: block;
    padding: 12px 16px;
    text-decoration: none;
    color: white;
  }

  .dropdown {
    position: relative;
  }

  .dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 200px;
    background: #001470;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    z-index: 100;
  }

  .dropdown-content a {
    white-space: nowrap;
  }

  .dropdown-content a:hover {
    background: #102580;
  }

  .dropdown:hover .dropdown-content,
  .dropdown:focus-within .dropdown-content {
    display: block;
  }
</script>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="page-width footer-inner">
      <span>Explore FoCo</span>
      <span>Plan your next visit to the Lanier County.</span>
    </div>
  </footer>
</body>
</html>
